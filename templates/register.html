<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Medicine Dispenser - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            background-color: #ffffff;
        }

        .form-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 6rem;
            background-color: #ffffff;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
            margin-bottom: 4rem;
        }

        .brand-header span { color: #0284c7; }

        .welcome-meta h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 0.5rem 0;
        }

        .welcome-meta p {
            color: #64748b;
            margin: 0 0 2rem 0;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover { background-color: #0369a1; }

        .link {
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            text-align: center;
        }
        .link:hover { color: #0284c7; }

        /* Premium Visual Side Panel Layout */
        .visual-side {
            background: linear-gradient(135deg, #0f172a 0%, #14b8a6 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .visual-side::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 80%);
            top: -50%; left: -50%;
        }

        .quote-box {
            position: relative;
            z-index: 10;
            max-width: 460px;
        }

        .quote-icon { font-size: 3.5rem; opacity: 0.3; margin-bottom: 1rem; line-height: 1; }

        .quote-text {
            font-size: 1.75rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .quote-author {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ccfbf1;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .visual-side { display: none; }
            .form-side { padding: 3rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="form-side">
        <a href="#" class="brand-header">Ya<span>capsule</span></a>
        <div class="welcome-meta">
            <h2>Create Authorized Space</h2>
            <p>Register an institutional staff user account to start managing dispensers.</p>
        </div>
        <form method="POST" action="/register">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>
            <button type="submit">Create Account</button>
        </form>
        <a href="/login" class="link">Already have an account? Login here</a>
    </div>
    
    <div class="visual-side">
        <div class="quote-box">
            <div class="quote-icon">“</div>
            <div class="quote-text">Empowering automation infrastructures to safeguard clinical dispatch pipelines.</div>
            <div class="quote-author">Yacapsule Integrations</div>
        </div>
    </div>
</body>
</html>
