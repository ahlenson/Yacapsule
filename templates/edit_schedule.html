<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 1.5rem 0;
            text-align: center;
        }
        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #64748b;
            display: block;
            margin-bottom: 0.5rem;
        }
        input[type="time"] {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            box-sizing: border-box;
            margin-bottom: 1.5rem;
        }
        input[type="time"]:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }
        button {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background-color: #0369a1; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #64748b;
            text-decoration: none;
        }
        .back-link:hover { color: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Schedule for {{ patient.name }}</h2>
        <form method="POST">
            <label for="new_schedule_time">Select New Schedule Time:</label>
            <input type="time" id="new_schedule_time" name="new_schedule_time"
                   value="{{ schedule_time.strftime('%H:%M:%S') if schedule_time else '' }}" required>
            <button type="submit">Save Updates</button>
        </form>
        <a href="/patients" class="back-link">Cancel and return</a>
    </div>
</body>
</html>
